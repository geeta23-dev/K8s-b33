apiVersion: v1
kind: Pod
metadata:
  name: np-pod
  labels:
    app: np
spec:
  containers:
  - name: tomcat-container
    image: tomcat:10.1
    Ports:
      - name: tomcat-port
        containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: np-svc
  labels:
    app: np
spec:
  type: NodePort
  selector:
    app: np
  ports:
  - name: tomcat-svc-port
    protocol: TCP
    targetPort: 8080
    NodePort: 30001       