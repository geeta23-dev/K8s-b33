apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
  labels:
    app: deploy 
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deploy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: deploy
    spec:
      containers:
        - name: nginx-cont
          images: nginx:latest
          ports:
            - name: nginx-port
              containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: deploy-svc 
  labels:
    app: deploy
spec:
  type: NodePort
  selector:
    app: deploy
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30001