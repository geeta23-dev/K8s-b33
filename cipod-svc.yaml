apiVersion: v1
kind: Pod
metadata:
  name: mypod
  labels:
    app: myapp
spec :
  type : nodeport
  selector :
    app : myapp
  Ports :
  - name : nginx-Port
    protocol : TCP
    port: 80
    targetPort : 80

    ---
    apiVersion: v1
    kind: service
    metadata:
      name: ci-pod
      labels:
        app: myapp
    spec:
      type: nodeport
      selector:
        app: myapp
      ports:
      - name: nginx-Port
        protocol:TCP
        port: 80
        targetPort: 80
      type: nodeport