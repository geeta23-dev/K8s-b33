apiVersion: v1
kind: Pod
metadata:
  name: cipod
  labels:
    app: ci
spec :
  containers:
  - name : nginx-containers
    image: nginx:latest
    ports:
      - name: nginx-port
        containerPort : 80
    ...
    ---
    apiVersion: v1
    kind: service
    metadata:
      name: ci-svc
      labels:
        app: ci
        env: dev
    spec:
      type: ClusterIp
      selector:
        app: ci
      ports:
      - name: ci-svc-Port
        protocol: TCP
        port: 80
        targetPort: 8080