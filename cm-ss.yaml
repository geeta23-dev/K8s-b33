apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: my-ss 
  labels:
    app: ss
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ss
  template:
    metadata: 
      labels:
        app: ss
    spec:
      containers:
        - name: mysql-container
          image: mysql:8.0
          ports:
            - containerPort: 3306

          env:
          - name: MYSQL_ROOT_PASSWORD
            valueFrom:
              configMapKeyRef:
                name: my-config
                key: mysql_root_password